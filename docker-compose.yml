services:

  # ── PostgreSQL Database ──────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: barb_db
    environment:
      POSTGRES_DB: ${DB_NAME:-barber}
      POSTGRES_USER: ${DB_USER:-barber}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-barber}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis Broker & Cache ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: barb_redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Django Web App (Daphne ASGI Server) ──────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barb_web
    command: web
    env_file:
      - .env
    environment:
      - DEBUG=False  # Tells settings.py to load PostgreSQL and disable dev logs
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/1
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Celery Worker (Task Executor) ────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barb_celery_worker
    command: worker
    env_file:
      - .env
    environment:
      - DEBUG=False
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/1
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  # ── Celery Beat (Periodic Task Scheduler) ────────────────────────────────
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barb_celery_beat
    command: beat
    env_file:
      - .env
    environment:
      - DEBUG=False
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/1
    volumes:
      - .:/app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  # ── Standalone Aiogram Bot ───────────────────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barb_bot
    command: bot
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://web:8000/api/
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    volumes:
      - .:/app
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: barb_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── React Frontend ───────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: barb_frontend
    ports:
      - "5173:80"
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  static_volume:
