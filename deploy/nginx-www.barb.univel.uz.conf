# Host nginx (system) — www.barb.univel.uz
# Frontend reload 404 bo'lmasligi uchun /api va /admin backendga,
# qolgan barcha yo'llar frontend SPA ga proxy qilinadi.
#
# O'rnatish (misol):
#   sudo cp deploy/nginx-www.barb.univel.uz.conf /etc/nginx/sites-available/barb
#   sudo ln -sf /etc/nginx/sites-available/barb /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream barb_backend {
    server 127.0.0.1:8080;
}

upstream barb_frontend {
    server 127.0.0.1:5173;
}

server {
    listen 80;
    server_name barb.univel.uz www.barb.univel.uz;
    return 301 https://www.barb.univel.uz$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.barb.univel.uz barb.univel.uz;

    # ssl_certificate /etc/letsencrypt/live/www.barb.univel.uz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.barb.univel.uz/privkey.pem;

    client_max_body_size 20M;

    location /api/ {
        proxy_pass http://barb_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://barb_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://barb_backend;
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass http://barb_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React SPA (docker frontend :5173 yoki statik dist)
    location / {
        proxy_pass http://barb_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
